{% extends "base.html" %}
{% block title %}Criar conta{% endblock %}
{% block content %}
<form class="card narrow form" method="post" action="/register">
  <h1>Criar conta</h1>
  {% for e in errors or [] %}<p class="msg error">{{ e }}</p>{% endfor %}
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Usuário <input name="username" value="{{ form.username or '' }}" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]+" autocomplete="username"></label>
  <label>E-mail <input type="email" name="email" value="{{ form.email or '' }}" required autocomplete="email"></label>
  <label>Data de nascimento <input type="date" name="birthdate" value="{{ form.birthdate or '' }}" required></label>
  <label>Senha <small>(mín. 10 caracteres, letras + números/símbolos)</small><input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
  <label>Repita a senha <input type="password" name="password2" required minlength="10" autocomplete="new-password"></label>
  <label class="check"><input type="checkbox" name="accept_terms" value="yes" required> Tenho {{ min_age }}+ anos e aceito os <a href="/terms" target="_blank">termos e regras</a>.</label>
  <button class="btn accent">Criar conta</button>
  <p class="small">Já tem conta? <a href="/login">Entrar</a></p>
</form>
{% endblock %}
